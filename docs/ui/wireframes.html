<header><div><div class="eyebrow">MACOS / DESIGN REVIEW</div><h1>Clickport 交互设计</h1><small>交互设计稿 · 示例数据 · 所有操作均为模拟</small></div><div class="views"><button data-view="finder" class="selected">Finder 右键</button><button data-view="settings">设置窗口</button><button data-view="panel">菜单栏菜单</button><button id="theme" aria-label="切换深浅色">◐</button></div></header>
<main><section id="finder" class="window"><div class="toolbar"><strong id="location-title">▱　示例文件夹</strong><div class="actions"><label for="context">右键位置</label><select id="context"><option value="file">单个文件</option><option value="folder">单个文件夹</option><option value="multi">多个文件</option><option value="blank">文件夹空白处</option><option value="desktop-blank">桌面空白处</option><option value="desktop-file">桌面上的文件</option></select><button id="show-menu">显示右键菜单</button></div></div><div class="finder"><aside class="finder-side">个人收藏<br>最近使用<br>文稿<br>下载<br>项目</aside><div class="canvas" id="canvas"><div class="files" id="files"></div><div class="menus" id="menus"></div></div></div><div class="toolbar"><small id="context-note"></small></div></section>
<section id="settings" class="window settings hidden"><aside class="side"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><nav id="nav" aria-label="设置分类"></nav><small style="padding:20px 10px">Clickport<br>设置设计预览</small></aside><div class="content" id="content"></div></section>
<section id="panel" class="window hidden"><div class="toolbar"><strong>菜单栏</strong><small>查看状态与打开设置</small></div><div style="min-height:380px;padding:24px;background:var(--side)"><div style="text-align:right;border-bottom:1px solid var(--line);padding-bottom:12px"><button id="status-toggle" aria-expanded="true" aria-label="展开或收起菜单栏菜单">Clickport</button></div><div class="menu" id="status-menu" style="margin:8px 0 0 auto"><div class="menu-label">Finder 扩展：已启用</div><hr><button data-view="settings">设置…<span>⌘,</span></button><hr><button data-demo="已模拟退出应用">退出 Clickport<span>⌘Q</span></button></div></div><p class="notice" style="padding:0 24px">菜单栏图标可在通用设置中隐藏。隐藏后，重新运行应用可打开设置。</p></section>
<footer>预览支持分类切换、开关、示例编辑、菜单展开、上下文切换及深浅色。刷新恢复示例数据。<br>Finder 系统菜单仅作位置示意；实际插入位置由 macOS 决定。此页面展示交互意图，不代表所有功能已通过原生实机验收。</footer></main>
<dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);const pages=['通用','打开方式','文件操作','新建文件','目录快捷入口','右键菜单','关于'];const paths={general:'M10 3v2m0 10v2M3 10h2m10 0h2M5 5l1.5 1.5m7 7L15 15M5 15l1.5-1.5m7-7L15 5M14 10a4 4 0 1 1-8 0 4 4 0 0 1 8 0',apps:'M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z',file:'M5 2h7l4 4v12H5zM12 2v5h4M8 11h5M8 14h5',plus:'M10 4v12M4 10h12',folder:'M2 5h6l2 2h8v10H2z',layout:'M7 5h10M7 10h10M7 15h10M3 5h.1M3 10h.1M3 15h.1',info:'M10 9v5M10 6h.01M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0'};const glyph=k=>`<svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><path d="${paths[k]}"/></svg>`;const icons=['general','apps','file','plus','folder','layout','info'].map(glyph);let current=0,sub='打开方式',dirty=false;
const state={login:false,tray:true,delete:false,copy:true,hide:true,air:true};let apps=[{name:'终端',on:true},{name:'代码编辑器',on:true},{name:'预览',on:false}];let dirs=[{name:'下载',on:true,status:'可用'},{name:'项目',on:true,status:'可用'},{name:'归档',on:false,status:'卷离线'}];let types=[{name:'纯文本',ext:'.txt',source:'内置',on:true},{name:'Markdown',ext:'.md',source:'内置',on:true},{name:'JSON',ext:'.json',source:'内置',on:true},{name:'Word 文档',ext:'.docx',source:'导入模板',on:true},{name:'Excel 工作簿',ext:'.xlsx',source:'导入模板',on:true},{name:'PowerPoint',ext:'.pptx',source:'导入模板',on:false},{name:'Pages 文稿',ext:'.pages',source:'未配置模板',on:false},{name:'Numbers 表格',ext:'.numbers',source:'未配置模板',on:false},{name:'Keynote 演示',ext:'.key',source:'未配置模板',on:false}];let applied=['打开方式','新建文件','文件操作','目录快捷入口'],draft=[...applied];
const quickOptions={copy:'复制路径',hide:'隐藏选中项',unhide:'取消隐藏选中项',air:'AirDrop',txt:'新建纯文本',md:'新建 Markdown'};let quickApplied=['copy'],quickDraft=[...quickApplied];
function pathLabel(){let c=menuContext();return c==='blank'?($('#context').value==='desktop-blank'?'复制桌面路径':'复制当前文件夹路径'):c==='multi'?'复制所选项路径':c==='folder'?'复制文件夹路径':'复制文件路径'}
function sourceEnabled(k){if(k==='copy')return state.copy;if(k==='hide'||k==='unhide')return state.hide;if(k==='air')return state.air;return types.find(t=>t.ext===(k==='txt'?'.txt':'.md'))?.on===true}

function quickEditor(){return group('第一层快捷操作 · '+quickDraft.length+' / 5',quickDraft.length?quickDraft.map((k,i)=>row(quickOptions[k],!sourceEnabled(k)?'来源功能已关闭 · 右键菜单中隐藏':k==='copy'?'名称随选中对象变化；空白处复制所在目录路径。':'',`<button data-action="quick-up:${i}" aria-label="上移${quickOptions[k]}" ${i===0?'disabled':''}>↑</button><button data-action="quick-down:${i}" aria-label="下移${quickOptions[k]}" ${i===quickDraft.length-1?'disabled':''}>↓</button>`+(!sourceEnabled(k)?`<button data-page="${k==='txt'||k==='md'?3:2}">${k==='txt'||k==='md'?'前往新建文件':'前往文件操作'}</button>`:'')+btn('移除','quick-remove:'+i))).join(''):'<p class="muted">未设置快捷操作，右键菜单仅显示分组。</p>')+`<p class="actions"><button data-action="quick-add" ${quickDraft.length>=5?'disabled':''}>＋ 添加快捷操作…</button><span class="muted">建议 1–3 项，最多 5 项</span></p><p class="notice">直接显示在右键菜单中，无需展开分组。保存后生效；移除快捷项不影响原分组入口。</p>`}
let menuPoint={x:110,y:70},closeTimer;

function toast(t){$('#toast').textContent=t+'（设计模拟）';$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}

function renderSettings(){ $('#nav').innerHTML=pages.map((p,i)=>`<button class="nav ${current===i?'active':''}" data-page="${i}" ${current===i?'aria-current="page"':''}><span class="icon" aria-hidden="true">${icons[i]}</span>${p}</button>`).join('');let body='';
if(current===0)body=group('启动与入口',row('登录时启动','',toggle('login',state.login,'登录时启动'))+row('显示菜单栏图标','关闭后，重新运行应用可打开设置。',toggle('tray',state.tray,'显示菜单栏图标')))+group('扩展与权限',row('Finder 扩展','已启用 · 右键菜单可用',btn('管理…','extension'))+row('文件夹访问权限','',btn('管理…','permissions')))+group('配置与诊断',row('配置文件','导入配置不会迁移系统授权。',btn('导入…','import')+btn('导出…','export'))+row('诊断日志','仅记录时间与事件，不记录路径和环境变量值。',btn('导出…','logs'))+row('恢复默认设置','',btn('恢复默认设置…','reset')));
if(current===1)body='<p class="muted">在右键菜单中，用指定应用打开选中的文件或目录。</p>'+group('已添加的应用',apps.map((a,i)=>row(esc(a.name),'',toggle('app'+i,a.on,a.name)+btn('↑','app-up:'+i)+btn('编辑…','app-edit:'+i))).join(''))+'<p>'+btn('＋ 添加应用…','app-add')+'</p><p class="notice">编辑中可配置显示名称、参数、环境变量和新实例请求。已有进程可能不接受参数；不保证目标应用一定打开新窗口。</p>';

function menuContext(){return $('#context').value==='desktop-blank'?'blank':$('#context').value==='desktop-file'?'file':$('#context').value}function renderMenu(){let c=menuContext(),desktop=$('#context').value.startsWith('desktop');$('#location-title').textContent=desktop?'▱　桌面':'▱　示例文件夹';$('#canvas').classList.toggle('desktop',desktop);$('.finder').classList.toggle('desktop-scene',desktop);$('#files').innerHTML=(c==='folder'?['示例项目']:['设计说明.md','配置.json','示例.txt']).map((f,i)=>`<div class="file ${(c==='multi'||(c!=='blank'&&i===0))?'selected':''}"><span class="file-icon">${glyph(c==='folder'?'folder':'file')}</span>${f}</div>`).join('');$('#context-note').textContent={file:'选中 1 个文件 · 新建文件位于其父目录。',folder:'选中 1 个文件夹 · 新建文件位于该目录内。',multi:'选中 3 个文件 · 新建前需明确指定一个目录。',blank:'当前目录空白处 · 无选中目标；新建使用当前目录。'}[c];if(desktop)$('#context-note').textContent=c==='blank'?'桌面空白处 · 新建文件保存到桌面；可复制桌面路径；打开方式与选中项操作不可用。':'桌面选中 1 个文件 · 操作针对该文件，新建文件保存到桌面。';let items=applied.map(x=>`<button data-sub="${x}" class="${sub===x?'chosen':''}" ${x==='打开方式'&&c==='blank'?'disabled':''}>${x}<span>›</span></button>`).join('');$('#menus').innerHTML=`<div class="menu"><div class="menu-label">Finder 系统菜单 · 位置示意</div>${desktop&&c==='blank'?'<button data-demo="系统新建文件夹">新建文件夹</button><button data-demo="系统更改墙纸">更改墙纸…</button><button data-demo="系统整理桌面">使用叠放</button><button data-demo="系统桌面排序">排序方式<span>›</span></button>':`<button data-demo="系统打开操作" ${c==='blank'?'disabled':''}>打开</button><button data-demo="系统显示简介">显示简介</button>`}<hr><div class="menu-label">Clickport 扩展操作</div>${quickApplied.filter(sourceEnabled).length?quickApplied.filter(sourceEnabled).map(k=>{let [label,action,disabled]=quickEntry(k);return `<button data-menu-action="${esc(action)}" ${disabled?'disabled':''}>${esc(label)}</button>`}).join('')+'<hr>':''}${items}<hr><button data-view="settings">设置…</button></div><div class="menu" id="submenu"></div>`;renderSub();placeMenus()}
function renderSub(){let c=menuContext();let entries=[];if(sub==='打开方式')entries=c==='blank'?[]:apps.filter(a=>a.on).map(a=>[a.name,'使用 '+a.name+' 打开选中项']);if(sub==='新建文件')entries=types.filter(t=>t.on).map(t=>[t.name+' '+t.ext,c==='multi'?'choose-dir':'在'+($('#context').value.startsWith('desktop')?'桌面':'示例目录')+'创建 '+t.name+' 并定位文件']);if(sub==='目录快捷入口')entries=dirs.filter(d=>d.on).map(d=>[d.name,'打开 '+d.name,d.status!=='可用']);if(sub==='文件操作'){if(state.copy)entries.push([pathLabel(),'模拟'+pathLabel()+(c==='multi'?'，每行一项':'')]);if(state.hide)entries.push(['隐藏选中项','隐藏选中项',c==='blank'],['取消隐藏选中项','取消隐藏选中项',c==='blank'],['取消隐藏当前目录直接子项…','unhide']);if(state.air)entries.push(['AirDrop…','系统 AirDrop 面板将打开，发送结果由系统显示',c==='blank'||c==='folder']);if(state.delete&&c!=='blank')entries.push(['直接删除…','delete'])}$('#submenu').innerHTML=`<div class="menu-label">${sub}</div>`+(entries.length?entries.map(([label,action,disabled])=>`<button data-menu-action="${esc(action)}" ${disabled?'disabled':''} ${action==='delete'?'class="danger"':''}>${esc(label)}</button>`).join(''):'<small style="padding:8px">当前没有可用项目</small>')+(sub==='文件操作'&&c==='folder'?'<small style="padding:8px">AirDrop 不支持此示例目录。</small>':'');}
function edit(kind,i){let list=kind==='app'?apps:dirs,a=list[i];modal(a?'编辑'+(kind==='app'?'应用':'目录'):'添加'+(kind==='app'?'应用':'目录'),`<label class="field">显示名称<input id="edit-name" maxlength="40" value="${esc(a?.name||'')}" placeholder="输入示例名称"></label><label class="field">${kind==='app'?'应用位置':'目录位置'}<input value="示例卷 / ${esc(a?.name||'待选择')}" readonly></label><small>位置选择器在本稿使用示例数据。</small>${kind==='app'?'<details><summary>高级启动选项</summary><label class="field">参数（逐项）<textarea placeholder="每行一个参数"></textarea></label><label class="field">环境变量<textarea placeholder="KEY=VALUE（仅示例）"></textarea></label><label><input type="checkbox"> 请求新实例</label><small>不执行任意 Shell 字符串，也不保证新窗口。</small></details>':'<small>重新选择位置后恢复可用状态。</small>'}${a?'<p><button id="remove-item" class="danger">移除此项</button></p>':''}`,'保存',()=>{let name=$('#edit-name').value.trim();if(!name){$('#edit-name').focus();return false}if(a)a.name=name;else list.push({name,on:true,status:'可用'});renderSettings();toast('已保存示例条目')});if(a)$('#remove-item').onclick=()=>{list.splice(i,1);$('#dialog').close();renderSettings()}}
function action(a){let [op,n]=a.split(':'),i=Number(n);if(op==='quick-add'){if(quickDraft.length>=5)return;return modal('添加快捷操作',`<p class="muted">选择已有操作，直接显示在扩展菜单第一层。</p><label class="field">操作<select id="quick-choice">${Object.entries(quickOptions).filter(([k])=>!quickDraft.includes(k)).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><small>不开放脚本、Shell 或直接删除。</small>`,'添加',()=>{let k=$('#quick-choice').value;if(k&&quickDraft.length<5&&!quickDraft.includes(k)){quickDraft.push(k);dirty=true;renderSettings()}})}if(op==='quick-remove'){quickDraft.splice(i,1);dirty=true;renderSettings();return}if(op==='quick-up'||op==='quick-down'){let j=i+(op==='quick-up'?-1:1);if(j>=0&&j<quickDraft.length){[quickDraft[i],quickDraft[j]]=[quickDraft[j],quickDraft[i]];dirty=true;renderSettings()}return}if(op==='theme'){document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';return}if(op==='app-edit'||op==='dir-edit')return edit(op.startsWith('app')?'app':'dir',i);if(op==='app-add'||op==='dir-add')return edit(op.startsWith('app')?'app':'dir',-1);if(op.endsWith('-up')||op==='menu-down'){let list=op.startsWith('app')?apps:op.startsWith('dir')?dirs:draft,j=op==='menu-down'?i+1:i-1;if(j>=0&&j<list.length){[list[i],list[j]]=[list[j],list[i]];if(list===draft)dirty=true;renderSettings()}return}
if(op==='discard'){draft=[...applied];quickDraft=[...quickApplied];dirty=false;renderSettings();return toast('已放弃未保存的菜单更改')}if(op==='apply'){quickApplied=[...quickDraft];applied=[...draft];dirty=false;renderSettings();return toast('菜单更改已保存，可在 Finder 右键中预览')}
if(op==='menu-reset')return modal('恢复默认布局？','<p>当前草稿将恢复为默认四组与“复制路径”快捷操作，点击“保存菜单更改”后生效。</p>','恢复默认',()=>{draft=['打开方式','新建文件','文件操作','目录快捷入口'];quickDraft=['copy'];dirty=true;renderSettings()});

if(op==='reset')return modal('恢复默认设置？','<p>将恢复通用选项、文件操作开关和右键菜单的默认配置，并清除自定义应用、目录快捷入口和模板引用。不会删除实际文件、应用或模板，也不会撤销系统权限。<br><br>本预览仅恢复初始示例数据。</p>','恢复默认设置',()=>location.reload());
if(op==='permissions')return modal('文件夹访问权限','<div class="group">'+row('示例项目目录','已授权 · 仅此目录','<button id="revoke">撤销</button>')+'</div>','完成',()=>{}),$('#revoke').onclick=()=>{$('#revoke').disabled=true;$('#revoke').textContent='已撤销';toast('已撤销示例授权')};

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view)view(b.dataset.view);if(b.dataset.demo)toast(b.dataset.demo);if(b.dataset.page!==undefined){let next=Number(b.dataset.page);if(current===5&&dirty&&next!==5)modal('离开右键菜单？','<p>有未保存的菜单更改。离开后保留草稿，右键预览仍使用上次保存的配置。取消可继续编辑。</p>','保留草稿并离开',()=>{current=next;renderSettings()});else{current=next;renderSettings()}}if(b.dataset.sub)openSub(b);if(b.dataset.action)action(b.dataset.action);if(b.dataset.menuAction){let a=b.dataset.menuAction,c=menuContext();if(a==='delete')modal('直接删除选中项？',`<p>将永久删除 ${c==='multi'?'3':'1'} 项，无法恢复。</p><details open><summary>查看目标</summary><p>${c==='multi'?'示例卷 / 示例文件夹 / 设计说明.md<br>示例卷 / 示例文件夹 / 配置.json<br>示例卷 / 示例文件夹 / 示例.txt':c==='folder'?'示例卷 / 示例项目':($('#context').value.startsWith('desktop')?'示例桌面 / 设计说明.md':'示例卷 / 示例文件夹 / 设计说明.md')}</p></details>`,'模拟删除',()=>toast('删除流程演示完成，未操作文件'));else if(a==='unhide')modal('取消隐藏直接子项？','<p>范围：'+($('#context').value.startsWith('desktop')?'桌面':'示例文件夹')+'的直接子项。不会递归子目录。</p>','模拟继续',()=>toast('已模拟取消隐藏直接子项'));else if(a==='choose-dir')modal('选择新建目标目录','<p>已选择多个文件，请明确指定一个目录。</p><label class="field">示例目标<select><option>示例卷 / 示例文件夹</option><option>示例卷 / 项目</option></select></label>','模拟新建',()=>toast('已在明确指定的示例目录创建并定位文件'));else toast(a)}});
document.addEventListener('change',e=>{let k=e.target.dataset.key;if(!k)return;let on=e.target.checked;if(k==='delete'&&on){e.target.checked=false;modal('启用直接删除？','<p>启用后，右键菜单会增加“直接删除”。每次删除仍需确认，且无法恢复。</p>','启用',()=>{state.delete=true;renderSettings()});return}if(k.startsWith('app'))apps[+k.slice(3)].on=on;else if(k.startsWith('dir'))dirs[+k.slice(3)].on=on;else if(k.startsWith('type')){let t=types[+k.slice(4)];if(on&&t.source==='未配置模板'){e.target.checked=false;toast('请先配置有效模板');return}t.on=on}else state[k]=on});
$('#theme').onclick=()=>action('theme');$('#context').onchange=()=>{sub=menuContext()==='blank'?'新建文件':'打开方式';showMenu()};$('#show-menu').onclick=()=>{menuPoint={x:110,y:70};showMenu()};$('#canvas').oncontextmenu=e=>{if(e.target.closest('.menus'))return;e.preventDefault();let r=$('#canvas').getBoundingClientRect();menuPoint={x:e.clientX-r.left,y:e.clientY-r.top};let desktop=$('#context').value.startsWith('desktop');if(desktop)$('#context').value=e.target.closest('.file')?'desktop-file':'desktop-blank';showMenu()};$('#status-toggle').onclick=()=>{const m=$('#status-menu');m.hidden=!m.hidden;$('#status-toggle').setAttribute('aria-expanded',String(!m.hidden))};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open)$('#menus').hidden=true});

function placeMenus(){const canvas=$('#canvas'),menus=$('#menus');if(menus.hidden||!canvas.clientWidth)return;const main=menus.firstElementChild;const x=Math.max(8,Math.min(menuPoint.x,canvas.clientWidth-main.offsetWidth-8));const y=Math.max(8,Math.min(menuPoint.y,canvas.clientHeight-main.offsetHeight-8));menus.style.left=x+'px';menus.style.top=y+'px';const child=$('#submenu');if(!child||child.hidden)return;const chosen=menus.querySelector('[data-sub].chosen');const wanted=chosen?chosen.offsetTop:0;child.style.top=Math.max(-y+8,Math.min(wanted,canvas.clientHeight-y-child.offsetHeight-8))+'px';const right=x+main.offsetWidth+4+child.offsetWidth;child.style.left=(right<=canvas.clientWidth-8?main.offsetWidth+4:x-child.offsetWidth-4>=8?-child.offsetWidth-4:Math.max(8-x,canvas.clientWidth-child.offsetWidth-x-8))+'px';}
